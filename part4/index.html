<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Places</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icon.png">
</head>
<body>
    <header>
        <img src="logo.png" alt="HBnB Logo" class="logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <!-- Login link with id for toggling visibility -->
                <li><a href="login.html" id="login-link" class="login-button">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Available Places</h1>

        <!-- Price Filter Dropdown -->
        <div class="filter-container" style="margin: 20px 0;">
            <label for="price-filter"><strong>Filter by Max Price:</strong> </label>
            <select id="price-filter" style="padding: 5px; border-radius: 5px;">
                <option value="All">All</option>
                <option value="10">10</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </div>

        <!-- Places List Container -->
        <section id="places-list" class="places-list">
            <!-- Dynamically populated place cards will appear here -->
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HBnB. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
